<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英単語トレーナー</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dce3ee;
  --accent:#3b67e8;--accent2:#6d4ae8;--good:#138a5b;--bad:#d44242;
  --shadow:0 14px 36px rgba(31,51,89,.12)
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#eef3ff,#f9fbff 48%,#f5f1ff);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;min-height:100vh}
button,input,select{font:inherit} button{cursor:pointer}
.app{max-width:1080px;margin:auto;padding:18px 16px 90px}
header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:clamp(24px,4vw,38px);margin:0;letter-spacing:.02em}
.badge{background:#18233b;color:#fff;padding:8px 12px;border-radius:999px;font-size:13px}
.panel{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}
select,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text)}
.categories{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;max-height:114px;overflow:auto;padding:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:13px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.topstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.stage{margin-top:14px;min-height:430px;display:flex;align-items:center;justify-content:center}
.card{width:min(720px,100%);min-height:360px;background:var(--card);border-radius:26px;box-shadow:var(--shadow);border:1px solid #e9edf5;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.kicker{font-size:13px;color:var(--muted);margin-bottom:18px}
.prompt{font-weight:800;font-size:clamp(30px,6vw,58px);line-height:1.18;word-break:break-word}
.answer{font-size:clamp(22px,4vw,38px);margin-top:22px;line-height:1.35}
.hidden{display:none!important}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.btn{border:none;border-radius:14px;padding:12px 18px;background:#edf1f8;color:var(--text);font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.good{background:#e2f6ee;color:var(--good)}
.btn.bad{background:#fde8e8;color:var(--bad)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:24px}
.choice{border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;text-align:left;min-height:58px}
.choice.correct{border-color:var(--good);background:#eaf8f2}.choice.wrong{border-color:var(--bad);background:#fff0f0}
.feedback{min-height:28px;margin-top:14px;font-weight:700}
.typebox{display:flex;gap:10px;width:100%;max-width:600px;margin-top:24px}.typebox input{flex:1}
.listwrap{width:100%;align-self:stretch}
.search{margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);position:sticky;top:0;background:#f8fafc}
tbody tr:last-child td{border-bottom:none}.tiny{font-size:12px;color:var(--muted)}
.progressbar{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin-top:12px}.progressbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.topstats{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.card{padding:22px 16px;min-height:390px}.prompt{font-size:34px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>英単語トレーナー</h1><div class="tiny">写真の単語を、覚える・解く・復習する</div></div><div class="badge" id="countBadge"></div></header>

<section class="panel">
  <div class="controls">
    <div><label>学習モード</label><select id="mode">
      <option value="flash">単語帳</option><option value="choice">四択クイズ</option>
      <option value="typing">入力クイズ</option><option value="list">一覧・検索</option>
      <option value="weak">苦手復習</option>
    </select></div>
    <div><label>出題方向</label><select id="direction">
      <option value="en-jp">英語 → 日本語</option><option value="jp-en">日本語 → 英語</option><option value="mixed">ランダム</option>
    </select></div>
    <div><label>出題順</label><select id="order"><option value="shuffle">シャッフル</option><option value="sequential">順番</option></select></div>
    <div><label>出題数</label><select id="limit"><option>10</option><option>20</option><option>30</option><option>50</option><option value="all">すべて</option></select></div>
  </div>
  <div class="categories" id="categories"></div>
  <div class="progressbar"><div id="bar"></div></div>
</section>

<div class="topstats">
 <div class="stat"><b id="sDone">0</b><span>今回の回答</span></div>
 <div class="stat"><b id="sCorrect">0</b><span>正解</span></div>
 <div class="stat"><b id="sRate">—</b><span>正答率</span></div>
 <div class="stat"><b id="sWeak">0</b><span>苦手単語</span></div>
</div>

<section class="stage" id="stage"></section>
<footer>学習記録はこの端末のブラウザ内に保存されます。英単語の発音ボタンは端末の音声機能を利用します。</footer>
</div>

function direction(){
 const d=$("#direction").value;
 return d==="mixed"?(Math.random()<.5?"en-jp":"jp-en"):d;
}
function updateStats(){
 $("#sDone").textContent=state.done;$("#sCorrect").textContent=state.correct;
 $("#sRate").textContent=state.done?Math.round(state.correct/state.done*100)+"%":"—";
 $("#sWeak").textContent=WORDS.filter(w=>{let s=stats[key(w)];return s&&s.wrong>s.right}).length;
 $("#bar").style.width=(state.deck.length?Math.min(100,state.idx/state.deck.length*100):0)+"%";
}
function renderCategories(){
 $("#categories").innerHTML=cats.map(c=>`<button class="chip ${state.categories.has(c)?"active":""}" data-c="${c}">${c}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
   const c=b.dataset.c;
   if(c==="すべて"){state.categories=new Set(["すべて"])}
   else{state.categories.delete("すべて");state.categories.has(c)?state.categories.delete(c):state.categories.add(c);if(!state.categories.size)state.categories.add("すべて")}
   renderCategories();start();
 });
}
function start(){
 state.deck=selectedWords();state.idx=0;state.done=0;state.correct=0;state.answered=false;
 render();updateStats();
}
function next(){
 state.idx++;state.answered=false;render();updateStats();
}
function doneScreen(){
 $("#stage").innerHTML=`<div class="card"><div class="kicker">学習完了</div><div class="prompt">${state.correct} / ${state.done}</div><div class="answer">正答率 ${state.done?Math.round(state.correct/state.done*100):0}%</div><div class="actions"><button class="btn primary" onclick="start()">もう一度</button><button class="btn" onclick="document.querySelector('#mode').value='weak';start()">苦手だけ復習</button></div></div>`;
}
function promptAnswer(w,d){return d==="en-jp"?[w.en,w.jp]:[w.jp,w.en]}
function render(){
 const mode=$("#mode").value;
 if(mode==="list"){renderList();return}
 if(!state.deck.length){$("#stage").innerHTML=`<div class="card"><div class="prompt">対象の単語がありません</div><div class="answer">カテゴリーや苦手記録を確認してください。</div></div>`;return}
 if(state.idx>=state.deck.length){doneScreen();return}
 const w=state.deck[state.idx],d=direction();state.current={w,d};
 if(mode==="flash"||mode==="weak")renderFlash(w,d);
 else if(mode==="choice")renderChoice(w,d);
 else renderTyping(w,d);
}
function renderFlash(w,d){
 const [q,a]=promptAnswer(w,d);
 $("#stage").innerHTML=`<div class="card">
 <div class="kicker">${w.category}　${state.idx+1} / ${state.deck.length}</div>
 <div class="prompt">${q}</div>
 <div id="ans" class="answer hidden">${a}</div>
 <div class="actions">
 ${d==="en-jp"?`<button class="btn" onclick="speak(${JSON.stringify(w.en)})">🔊 発音</button>`:""}
 <button id="show" class="btn primary">答えを見る</button>
 </div>
 <div id="judge" class="actions hidden"><button class="btn bad" id="ng">まだ</button><button class="btn good" id="ok">覚えた</button></div>
 </div>`;
 $("#show").onclick=()=>{$("#ans").classList.remove("hidden");$("#show").classList.add("hidden");$("#judge").classList.remove("hidden")};
 $("#ok").onclick=()=>{record(w,true);state.done++;state.correct++;next()};
 $("#ng").onclick=()=>{record(w,false);state.done++;next()};
}
function renderChoice(w,d){
 const [q,a]=promptAnswer(w,d);
 let pool=WORDS.filter(x=>x.category===w.category&&key(x)!==key(w));
 if(pool.length<3)pool=WORDS.filter(x=>key(x)!==key(w));
 shuffle(pool);let options=shuffle([a,...pool.slice(0,3).map(x=>d==="en-jp"?x.jp:x.en)]);
 $("#stage").innerHTML=`<div class="card">
 <div class="kicker">${w.category}　${state.idx+1} / ${state.deck.length}</div>
 <div class="prompt">${q}</div>
 <div class="choices">${options.map((x,i)=>`<button class="choice" data-v="${encodeURIComponent(x)}"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join("")}</div>
 <div class="feedback" id="feedback"></div>
 ${d==="en-jp"?`<div class="actions"><button class="btn" onclick="speak(${JSON.stringify(w.en)})">🔊 発音</button></div>`:""}
 </div>`;
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
   if(state.answered)return;state.answered=true;
   const v=decodeURIComponent(b.dataset.v),ok=v===a;
   b.classList.add(ok?"correct":"wrong");
   document.querySelectorAll(".choice").forEach(x=>{if(decodeURIComponent(x.dataset.v)===a)x.classList.add("correct");x.disabled=true});
   $("#feedback").textContent=ok?"正解！":"不正解　正解："+a;
   $("#feedback").style.color=ok?"var(--good)":"var(--bad)";
   record(w,ok);state.done++;if(ok)state.correct++;updateStats();
   setTimeout(next,900);
 })
}
function renderTyping(w,d){
 const [q,a]=promptAnswer(w,d);
 $("#stage").innerHTML=`<div class="card">
 <div class="kicker">${w.category}　${state.idx+1} / ${state.deck.length}</div>
 <div class="prompt">${q}</div>
 <div class="typebox"><input id="typeAnswer" type="text" autocomplete="off" placeholder="答えを入力"><button class="btn primary" id="check">判定</button></div>
 <div class="feedback" id="feedback"></div>
 ${d==="en-jp"?`<div class="actions"><button class="btn" onclick="speak(${JSON.stringify(w.en)})">🔊 発音</button></div>`:""}
 </div>`;
 const inp=$("#typeAnswer");inp.focus();
 function check(){
   if(state.answered)return;state.answered=true;
   const user=normalize(inp.value);
   const acceptable=(d==="jp-en"?w.en.split(/[,/]/):w.jp.split(/[、,／/]/)).map(normalize);
   const ok=acceptable.some(x=>x&&user===x) || normalize(a)===user;
   $("#feedback").textContent=ok?"正解！":"正解："+a;
   $("#feedback").style.color=ok?"var(--good)":"var(--bad)";
   record(w,ok);state.done++;if(ok)state.correct++;updateStats();
   $("#check").textContent="次へ";$("#check").onclick=next;
 }
 $("#check").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")(state.answered?next():check())};
}
function renderList(){
 let arr=selectedWords();
 $("#stage").innerHTML=`<div class="panel listwrap"><div class="search"><input id="search" type="text" placeholder="英語・日本語・カテゴリーで検索"></div>
 <div style="max-height:620px;overflow:auto"><table><thead><tr><th>英語</th><th>日本語</th><th>カテゴリー</th><th>記録</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;
 function draw(){
  const q=normalize($("#search").value);
  const f=arr.filter(w=>!q||normalize(w.en+" "+w.jp+" "+w.category).includes(q));
  $("#rows").innerHTML=f.map(w=>{const s=stats[key(w)]||{right:0,wrong:0};return `<tr><td><b>${w.en}</b> <button class="btn" style="padding:4px 7px" onclick="speak(${JSON.stringify(w.en)})">🔊</button></td><td>${w.jp}</td><td>${w.category}</td><td>○${s.right} / ×${s.wrong}</td></tr>`}).join("");
 }
 $("#search").oninput=draw;draw();
}
["mode","direction","order","limit"].forEach(id=>$("#"+id).onchange=start);
$("#countBadge").textContent=WORDS.length+"語収録";
renderCategories();start();
</script>
</body>
</html>
